name: daily-build

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  push:
    branches: [main]
    paths: ["config/**", "data/manual/**", "data/overrides.yaml", "site/**", "yc/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: 수집과 빌드
        run: python -m yc.build
      - name: 상태 파일 커밋
        run: |
          git config user.name "yonsei-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily events update"
            git pull --rebase && git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
