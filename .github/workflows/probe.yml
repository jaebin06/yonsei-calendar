name: probe

# 개발용: 수집 대상 페이지의 원본 HTML을 tests/fixtures/raw/ 에 저장한다.
# scripts/probe_urls.txt 를 고쳐서 push 하면 실행된다.
on:
  push:
    branches: [main]
    paths: ["scripts/probe_urls.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 받기
        run: |
          mkdir -p tests/fixtures/raw
          grep -v '^#' scripts/probe_urls.txt | while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sS -L -m 30 -A "Mozilla/5.0 (yonsei-calendar; personal use)" \
              -o "tests/fixtures/raw/$name.html" -w "%{http_code}" "$url" || echo "ERR")
            echo "$name $code $(wc -c < tests/fixtures/raw/$name.html 2>/dev/null) $url" | tee -a tests/fixtures/raw/_log.txt
            sleep 2
          done
      - name: 커밋
        run: |
          git config user.name "yonsei-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/raw
          git commit -m "chore: probe fixtures" || exit 0
          git pull --rebase && git push
