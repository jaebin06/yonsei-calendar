name: apply-issue

# 대시보드의 별표·숨기기 버튼, '직접 추가' 양식으로 만든 이슈를 overrides.yaml에 반영한다.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    # 저장소 주인이 만든 이슈만 처리 (다른 사람이 캘린더를 바꾸지 못하게)
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: apply
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/apply_issue.py
        continue-on-error: true
      - name: 커밋
        if: steps.apply.outputs.message != ''
        env:
          MSG: ${{ steps.apply.outputs.message }}
        run: |
          git config user.name "yonsei-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overrides.yaml
          git commit -m "chore: $MSG (#${{ github.event.issue.number }})"
          git pull --rebase && git push
      - name: 다시 빌드
        if: steps.apply.outputs.message != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --repo ${{ github.repository }}
      - name: 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.apply.outputs.message }}
          ERR: ${{ steps.apply.outputs.error }}
        run: |
          if [ -n "$MSG" ]; then
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "반영했어요: $MSG. 몇 분 뒤 대시보드와 피드가 갱신돼요."
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "반영하지 못했어요: $ERR"
          fi
