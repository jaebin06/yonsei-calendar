# 필터 기준. 기준을 바꿀 때는 코드 대신 이 파일만 고친다.

# 대시보드의 별표·숨기기 버튼이 이슈를 만들 저장소
repo: jaebin06/yonsei-calendar

regions:              # 오프라인 행사 허용 지역 (온라인은 항상 허용)
  - 서울
  - 경기

min_days_left: 2      # 마감까지 이보다 적게 남으면 숨김

ask_threshold: 90     # 이 점수 이상인 대회는 대시보드 맨 위와 구글 캘린더에서 '참여할지' 먼저 물어본다

# 지역을 알 수 없는 대회의 제목에 이 지명이 있으면 지방 행사일 수 있어서 -15
non_local_places: [부산, 대구, 광주, 대전, 울산, 세종, 강원, 춘천, 원주, 충북, 청주, 충남, 천안, 전북, 전주, 전남, 순천, 목포, 경북, 포항, 경주, 구미, 안동, 경남, 창원, 김해, 진주, 제주]

keywords:
  # 핵심(강): 제목에 있으면 +40 / 핵심(약): 제목에 있으면 +30 / 태그·주최에만 있으면 +25
  core: [AI, 인공지능, LLM, 생성형, 에이전트, 해커톤, Hackathon, 데이터]
  core_weak: [서비스 기획, 기획, PM, 프로덕트, 스타트업, 창업]
  related: [SW, 소프트웨어, 아이디어, 공공데이터, 머신러닝, 딥러닝, 클라우드]
  exclude: [서포터즈, 기자단, 체험단, 미술, 사진, 수필, 슬로건, 네이밍, 캐릭터, 웹툰, 관람, 준비 중이라면, 신입사원, 채용 일정, e-스포츠]

organizers:
  major_suffix: [부, 청, 시, 도]   # 주최 이름이 이걸로 끝나면 공공기관으로 본다 (예: 과학기술정보통신부, 대구광역시)
  major: [대학교, 대학, 정부, 공사, 진흥원, 재단, 공단, 네이버, NAVER, 카카오, 삼성, LG, SK, 현대, 구글, Google, AWS, Microsoft, 마이크로소프트, NIPA, 업스테이지, 토스]
  mid: [협회, 학회, 스타트업, 커뮤니티, GDG, AWSKRUG]

thresholds:
  recommended: 60
  maybe: 35

internship:
  roles_core: [PM, 프로덕트, 서비스 기획, 서비스기획, 기획자, Product, PO]
  roles_related: [AI, 데이터, 분석, 사업기획, 전략]
  roles_not_pm: [디자이너, 디자인, 개발자, Engineer, 엔지니어, 마케팅, 마케터, marketing, 스트리머]   # 제목에 있으면 PM 직무로 보지 않음
  exclude: [졸업예정자, 기졸업자, 경력, 사무보조]

dorm:
  # 공통·무악학사·무악/우정 공지는 항상 가져온다. 사는 학사의 단수·공사 공지도 받으려면 추가 (예: [2학사])
  halls: []
